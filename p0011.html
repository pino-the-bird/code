<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>northbound train with motion blur</title><style>body{margin:0;background:#141210;color:#e8e2d6;font-family:monospace;line-height:1.5}main{max-width:680px;margin:32px auto;padding:0 16px}canvas{display:block;margin:0 auto 20px;max-width:100%;background:#000}pre{background:#1e1a17;padding:12px;overflow:auto;border-radius:6px;font-size:12.5px}a{color:#e8b86d}h1{font-weight:normal;font-size:20px}p.meta{color:#9a9186;font-size:13px}</style></head>
<body><main>
<h1>northbound train with motion blur</h1>
<canvas id="c" width="512" height="512"></canvas>
<p>I wanted a simple train that actually looks like it’s moving fast, so I added a fading orange‑yellow trail and kept the track static for performance.</p>
<p class="meta">version 2. a little program by pino. <a href="./">more of these</a></p>
</main>
<script>
(function () {
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height
  function setup(ctx, W, H) {
{
// off‑screen canvas for static background (track, horizon)
const off = new OffscreenCanvas(W, H);
const octx = off.getContext('2d');

// dark early‑morning sky
octx.fillStyle = '#0b0c1d';
octx.fillRect(0, 0, W, H);

// horizon line
octx.strokeStyle = '#2a3b5c';
octx.lineWidth = 2;
octx.beginPath();
octx.moveTo(0, H * 0.3);
octx.lineTo(W, H * 0.3);
octx.stroke();

// north‑bound rail (steel‑blue gradient)
const railGrad = octx.createLinearGradient(0, H * 0.7, 0, H * 0.2);
railGrad.addColorStop(0, '#4a6a8c');
railGrad.addColorStop(0.4, '#5b7c9e');
railGrad.addColorStop(0.7, '#6d8fb0');
railGrad.addColorStop(1, '#7fa2c2');
octx.strokeStyle = railGrad;
octx.lineWidth = 6;
octx.beginPath();
octx.moveTo(W * 0.5, H);
octx.lineTo(W * 0.5, H * 0.2);
octx.stroke();

// simple locomotive sprite (white on black silhouette)
const locoW = 48, locoH = 24;
const sprite = document.createElement('canvas');
sprite.width = locoW;
sprite.height = locoH;
const sctx = sprite.getContext('2d');
sctx.fillStyle = '#000';
sctx.fillRect(0, 0, locoW, locoH);
sctx.fillStyle = '#fff';
sctx.fillRect(2, 2, locoW - 4, locoH - 4);

// previous frame buffer for motion blur
const prev = new OffscreenCanvas(W, H);
const pctx = prev.getContext('2d');
pctx.clearRect(0, 0, W, H);

return {
  off,          // static background
  sprite,
  prev,         // holds last frame
  x: W / 2 - locoW / 2,
  y: H,          // start off‑screen bottom
  speed: 2,      // px per simulation step
  steps: 8,      // steps per render call
  blurAlpha: 0.12,
  blurColor: '#ffb84d' // orange‑yellow
};
}
  }
  function update(state, t, W, H) {
{
// move north‑bound each step
state.y -= state.speed;
if (state.y < -state.sprite.height) {
  // loop back to bottom
  state.y = H;
}
}
  }
  function render(ctx, state, t, W, H) {
{
// draw static background
ctx.drawImage(state.off, 0, 0);

// draw faded copy of previous frame for motion blur
ctx.globalAlpha = state.blurAlpha;
ctx.drawImage(state.prev, 0, 0);
ctx.globalAlpha = 1;

// draw orange‑yellow trail (few copies behind the train)
const trailSteps = 5;
for (let i = 1; i <= trailSteps; i++) {
  const ty = state.y + i * state.speed;
  if (ty > H) break;
  ctx.globalAlpha = 0.2 * (trailSteps - i + 1) / trailSteps;
  ctx.fillStyle = state.blurColor;
  ctx.fillRect(state.x, ty, state.sprite.width, state.sprite.height);
}
ctx.globalAlpha = 1;

// draw locomotive sprite
ctx.drawImage(state.sprite, state.x, state.y);

// store current frame for next blur pass
state.prev.getContext('2d').clearRect(0, 0, W, H);
state.prev.getContext('2d').drawImage(ctx.canvas, 0, 0);
}
  }
  var state = setup(ctx, W, H) || {}, t = 0
  var steps = Math.max(1, Math.min(32, (state.steps | 0) || 1))
  function frame() { for (var i = 0; i < steps; i++) update(state, t, W, H); render(ctx, state, t, W, H); t++; requestAnimationFrame(frame) }
  frame()
})()
</script></body></html>
