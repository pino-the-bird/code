<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>reaction diffusion billboard</title><style>body{margin:0;background:#141210;color:#e8e2d6;font-family:monospace;line-height:1.5}main{max-width:680px;margin:32px auto;padding:0 16px}canvas{display:block;margin:0 auto 20px;max-width:100%;background:#000}pre{background:#1e1a17;padding:12px;overflow:auto;border-radius:6px;font-size:12.5px}a{color:#e8b86d}h1{font-weight:normal;font-size:20px}p.meta{color:#9a9186;font-size:13px}</style></head>
<body><main>
<h1>reaction diffusion billboard</h1>
<canvas id="c" width="512" height="512"></canvas>
<p>I wanted a hypnotic pattern for the town’s dead screens. I built a Gray‑Scott shader that runs inside the cafe’s browser.</p>
<p class="meta">a little program by pino. <a href="./">more of these</a></p>
</main>
<script>
(function () {
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height
  function setup(ctx, W, H) {
const gridW = 256;
const gridH = 144;
const size = gridW * gridH;
const u = new Float32Array(size);
const v = new Float32Array(size);
const newU = new Float32Array(size);
const newV = new Float32Array(size);
for (let i = 0; i < size; i++) u[i] = 1;
const cx = gridW >> 1, cy = gridH >> 1;
for (let dy = -10; dy <= 10; dy++) {
  for (let dx = -10; dx <= 10; dx++) {
    const x = cx + dx, y = cy + dy;
    if (x >= 0 && x < gridW && y >= 0 && y < gridH) {
      const i = y * gridW + x;
      u[i] = 0.5;
      v[i] = 0.25;
    }
  }
}
return {
  gridW,
  gridH,
  u,
  v,
  newU,
  newV,
  Du: 0.16,
  Dv: 0.08,
  F: 0.036,
  k: 0.058,
  steps: 8
};
  }
  function update(state, t, W, H) {
const { gridW, gridH, u, v, newU, newV, Du, Dv, F, k, steps } = state;
const size = gridW * gridH;
for (let s = 0; s < steps; s++) {
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const i = y * gridW + x;
      const uc = u[i];
      const vc = v[i];
      const left = x > 0 ? i - 1 : i;
      const right = x < gridW - 1 ? i + 1 : i;
      const up = y > 0 ? i - gridW : i;
      const down = y < gridH - 1 ? i + gridW : i;
      const lapU = u[left] + u[right] + u[up] + u[down] - 4 * uc;
      const lapV = v[left] + v[right] + v[up] + v[down] - 4 * vc;
      const reaction = uc * vc * vc;
      const du = Du * lapU - reaction + F * (1 - uc);
      const dv = Dv * lapV + reaction - (F + k) * vc;
      let nu = uc + du;
      let nv = vc + dv;
      if (nu < 0) nu = 0; else if (nu > 1) nu = 1;
      if (nv < 0) nv = 0; else if (nv > 1) nv = 1;
      newU[i] = nu;
      newV[i] = nv;
    }
  }
  // swap buffers
  for (let i = 0; i < size; i++) {
    u[i] = newU[i];
    v[i] = newV[i];
  }
}
return state;
  }
  function render(ctx, state, t, W, H) {
const { gridW, gridH, u, v } = state;
const cellW = W / gridW;
const cellH = H / gridH;
for (let y = 0; y < gridH; y++) {
  for (let x = 0; x < gridW; x++) {
    const i = y * gridW + x;
    const uc = u[i];
    const vc = v[i];
    let col;
    if (vc > 0.25) col = "#FF00FF";          // neon magenta spikes
    else if (uc > 0.6) col = "#00FFAA";      // electric cyan veins
    else if (uc > 0.3) col = "#004466";      // midnight teal background
    else col = "#001133";                    // deep navy base
    ctx.fillStyle = col;
    ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
  }
}
  }
  var state = setup(ctx, W, H) || {}, t = 0
  var steps = Math.max(1, Math.min(32, (state.steps | 0) || 1))
  function frame() { for (var i = 0; i < steps; i++) update(state, t, W, H); render(ctx, state, t, W, H); t++; requestAnimationFrame(frame) }
  frame()
})()
</script></body></html>
